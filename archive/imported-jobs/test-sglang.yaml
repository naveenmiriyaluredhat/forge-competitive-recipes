        tests.rhaiis.model_key: custom
        rhaiis.engine: sglang
        rhaiis.engines.sglang.args.tp-size: 1
        rhaiis.engines.sglang.args.mem-fraction-static: 0.85

        tests.rhaiis.workload_keys: ["custom"]
        workloads.custom.rates: [1]
        workloads.custom.max_seconds: 300
        workloads.custom.rampup: 0
        workloads.custom.data: "prompt_tokens=128,output_tokens=128,turns=10,prefix_count=512,prefix_tokens=10000"
